<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"></stop>
      <stop offset="50%" stop-color="#3b82f6"></stop>
      <stop offset="100%" stop-color="#a855f7"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- background rounded square -->
  <rect x="10" y="10" width="80" height="80" rx="22" fill="#050816"></rect>

  <!-- outer glow ring -->
  <circle cx="50" cy="50" r="34" stroke="url(#g1)" stroke-width="4" fill="none" filter="url(#glow)"></circle>

  <!-- main symbol (V + M fusion) -->
  <path d="M30 35 L50 70 L70 35" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"></path>

  <!-- center dot -->
  <circle cx="50" cy="52" r="3" fill="#22d3ee"></circle>

</svg>